<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RI2ACT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#7a2e1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RI2ACT">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a plan list on the home screen; inside a plan, a step rail (Parts 1–7 + Pitfalls) over one part at a time. */
:root {
  --bg: #f3f4f6;
  --paper: #ffffff;
  --ink: #1f2a37;
  --muted: #5b6675;
  --line: #d5dae2;
  --accent: #7a2e1f;
  --accent-soft: #f6e7e2;
  --accent-ink: #ffffff;
  --gold: #c99a1c;
  --good: #2f7d4f;
  --display: "Archivo", "Helvetica Neue", system-ui, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181d; --paper: #1d2128; --ink: #e6e9ee; --muted: #9aa3af; --line: #313844;
  --accent: #e08a74; --accent-soft: #3a2420; --accent-ink: #1a0f0c; --gold: #e3bb4f; --good: #6cc391; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15181d; --paper: #1d2128; --ink: #e6e9ee; --muted: #9aa3af; --line: #313844;
  --accent: #e08a74; --accent-soft: #3a2420; --accent-ink: #1a0f0c; --gold: #e3bb4f; --good: #6cc391; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 80px; display: flex; flex-direction: column; gap: 18px; }

header.app { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; text-align: left; }
.brand b { font: 800 30px/1 var(--display); font-stretch: 112%; letter-spacing: 0.02em; }
.brand b span { color: var(--accent); }
.brand small { font: 500 11px var(--mono); letter-spacing: 0.14em; color: var(--muted); }
.tools { display: flex; gap: 4px; flex-wrap: wrap; }

button { font: 500 14px var(--body); cursor: pointer; border-radius: 8px; padding: 9px 14px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.quiet { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 8px; }
button.quiet:hover { color: var(--ink); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=date], textarea {
  font: inherit; color: var(--ink); background: var(--paper); width: 100%;
  border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 11px;
}
textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
label.lbl { display: block; font-weight: 600; margin-bottom: 6px; }

.panel { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.eyebrow { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 750; font-stretch: 100%; }
h2 { font-size: 18px; font-weight: 700; }
.intro { color: var(--muted); margin: 0; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }

/* home */
.plans { display: flex; flex-direction: column; gap: 10px; }
.plan-card { text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; background: var(--paper); }
.plan-card .t { font: 700 17px var(--display); }
.plan-card .q { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dots { display: flex; gap: 4px; align-items: center; font: 12px var(--mono); color: var(--muted); }
.dot { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
.dot.partial { background: color-mix(in srgb, var(--gold) 70%, var(--line)); }
.dot.done { background: var(--good); }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty strong { color: var(--ink); font: 700 18px var(--display); }

/* plan view */
.plan-head { display: grid; grid-template-columns: 1fr 150px; gap: 10px; }
@media (max-width: 520px) { .plan-head { grid-template-columns: 1fr; } }
.rail { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.rail button { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 13px; }
.rail button .n { font: 500 12px var(--mono); }
.rail button.partial .n { color: var(--gold); }
.rail button.done .n { color: var(--good); }
.rail button[aria-current=step] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.rail button[aria-current=step] .n { color: inherit; }

.group-title { font: 600 14px var(--body); margin: 4px 0 -4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; font-size: 14px; text-align: left; }
.chip::before { content: ""; width: 14px; height: 14px; flex: none; border-radius: 4px; border: 1.5px solid var(--muted); }
.chip[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); }
.chip[aria-pressed=true]::before { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--paper); }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row-check { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; }
.row-check.on { border-color: var(--accent); background: var(--accent-soft); }
.row-check > button { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
.row-check > button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.box { width: 18px; height: 18px; flex: none; margin-top: 2px; border-radius: 5px; border: 1.5px solid var(--muted); display: grid; place-items: center; color: var(--accent-ink); font-size: 12px; line-height: 1; }
.on .box { background: var(--accent); border-color: var(--accent); }
.row-check .lab { font-weight: 500; }
.row-check .desc { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
.row-check .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-size: 13px; color: var(--muted); padding-left: 28px; }
.row-check .meta b { display: block; font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
@media (max-width: 520px) { .row-check .meta { grid-template-columns: 1fr; } }
.row-check .detail { padding-left: 28px; }

.builder { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; align-items: center; }
.builder label { font-size: 14px; color: var(--muted); }
@media (max-width: 520px) { .builder { grid-template-columns: 1fr; } .builder label { margin-bottom: -4px; } }
.preview { padding: 12px 14px; border-left: 3px solid var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--paper)); border-radius: 0 8px 8px 0; font-size: 15px; }
.preview i { color: var(--muted); }

.q-radio { display: flex; flex-direction: column; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.todo { display: grid; grid-template-columns: 1.3fr 1.1fr 130px 34px; gap: 6px; align-items: start; }
.todo-head { font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 600px) {
  .todo { grid-template-columns: 1fr 34px; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px; }
  .todo > :not(.x) { grid-column: 1; } .todo .x { grid-column: 2; grid-row: 1; }
  .todo-head { display: none; }
}
.todo .x { padding: 6px; }
.ref { padding: 10px 12px; border: 1.5px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 14px; }

.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.danger { color: #b3261e; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); }
footer.credit { font-size: 12px; color: var(--muted); text-align: center; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; display: flex; gap: 10px; align-items: center; z-index: 5; max-width: calc(100% - 32px); }
.toast button { padding: 3px 10px; background: transparent; color: var(--bg); border-color: currentColor; }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <button class="brand" id="homeBtn" aria-label="All plans">
      <b>RI<span>2</span>ACT</b>
      <small>PLNYRWRKWRKYRPLN · PLAN YOUR WORK, WORK YOUR PLAN</small>
    </button>
    <div class="tools">
      <button class="quiet" id="emailBackupBtn">Email backup</button>
      <button class="quiet" id="exportBtn">Export backup</button>
      <button class="quiet" id="importBtn">Import</button>
      <input type="file" id="importFile" accept=".csv,text/csv" hidden>
    </div>
  </header>
  <main id="view"></main>
  <footer class="credit">Worksheet: PAS 2025 Workshop, Bridging the Gaps: Advancing Pediatric Firearm Injury Prevention Research. Authors: SJ Patel, A Silver, MK Goyal, E Fleegler, N Romo, A Hogan, G Azzarone, K Gastineau.</footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="worksheet.js"></script>
<script>
const WS = window.WORKSHEET;
const PARTS = WS.parts;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const localDay = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

function toast(msg, action) {
  const t = $("toast");
  t.textContent = msg;
  if (action) {
    const b = document.createElement("button");
    b.textContent = action.label;
    b.onclick = () => { t.hidden = true; action.run(); };
    t.append(b);
  }
  t.hidden = false; clearTimeout(toast.h);
  toast.h = setTimeout(() => t.hidden = true, action ? 6000 : 2000);
}

/* ---------- storage (this device) ---------- */
const KEY = "ri2act";
let plans = [];
function load() { try { plans = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { plans = []; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(plans)); } catch { toast("Couldn't save on this device."); } }
let saveTimer;
const saveSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); };
window.addEventListener("pagehide", save);
navigator.storage?.persist?.().catch(() => {});

function newPlan() {
  const p = { id: uid(), created: Date.now(), updated: Date.now(), values: { plan_title: "", plan_date: localDay() }, todos: [{ task: "", who: "", deadline: "" }] };
  plans.unshift(p); save(); return p;
}
const planById = (id) => plans.find(p => p.id === id);
const titleOf = (p) => p.values.plan_title?.trim() || "Untitled research idea";

/* ---------- progress per part ---------- */
const allItems = (part) => part.groups.flatMap(g => g.items || []);
function partState(p, part) {
  const v = p.values, has = (id) => !!(v[id] && String(v[id]).trim());
  const anyOf = (items) => items.some(i => has(i.id) || (i.detail && has(i.detail)) || has(i.id + "_notes"));
  switch (part.id) {
    case "p1": { const [a, b] = part.groups; const pa = anyOf(a.items), pb = anyOf(b.items); return pa && pb ? "done" : pa || pb ? "partial" : ""; }
    case "p2": return anyOf(allItems(part)) ? "done" : "";
    case "p3": return has("rq_draft") ? "done" : ["rq_population", "rq_exposure", "rq_comparison", "rq_outcome", "rq_timeframe"].some(has) ? "partial" : "";
    case "p4": return anyOf(allItems(part)) ? "done" : "";
    case "p5": { const r = part.groups[0].items.filter(i => has(i.id)).length; return r === 5 ? "done" : r || has("feas_concerns") ? "partial" : ""; }
    case "p6": return has("rq_final") ? "done" : has("refine_feedback") ? "partial" : "";
    case "p7": return p.todos.some(t => t.task.trim()) ? "done" : "";
    case "pitfalls": { const n = allItems(part).filter(i => has(i.id)).length; return n === 7 ? "done" : n ? "partial" : ""; }
  }
  return "";
}

/* ---------- routing: #plan-<id>-<part> ---------- */
let current = null, step = 0;
function go(planId, partIndex = 0) {
  current = planId; step = partIndex;
  location.hash = planId ? `plan-${planId}-${partIndex}` : "";
  render(); window.scrollTo({ top: 0 });
}
function fromHash() {
  const m = location.hash.match(/^#plan-([a-z0-9]+)-(\d+)$/);
  if (m && planById(m[1])) { current = m[1]; step = Math.min(+m[2], PARTS.length - 1); } else current = null;
  render();
}
window.addEventListener("hashchange", fromHash);
$("homeBtn").addEventListener("click", () => go(null));

/* ---------- views ---------- */
function render() { current ? renderPlan(planById(current)) : renderHome(); }

function renderHome() {
  const view = $("view");
  if (!plans.length) {
    view.innerHTML = `<section class="panel empty">
      <strong>Turn a research idea into a plan</strong>
      <span>Each plan walks you through the seven parts of the worksheet: interests, gap, question, data, feasibility, refinement and next steps.</span>
      <button class="primary" data-act="new">Start a research idea</button></section>`;
    return;
  }
  const sorted = [...plans].sort((a, b) => b.updated - a.updated);
  view.innerHTML = `<section style="display:flex;flex-direction:column;gap:12px">
    <div class="pager"><h1>Research ideas</h1><button class="primary" data-act="new">New idea</button></div>
    <div class="plans">${sorted.map(p => {
      const q = p.values.rq_final || p.values.rq_draft || "No research question yet";
      const dots = PARTS.map(part => `<span class="dot ${partState(p, part)}" title="${esc(part.num ? "Part " + part.num : "Pitfalls")}"></span>`).join("");
      return `<button class="plan-card" data-open="${p.id}"><span class="t">${esc(titleOf(p))}</span>
        <span class="q">${esc(q)}</span>
        <span class="dots">${dots}<span style="margin-left:6px">updated ${new Date(p.updated).toLocaleDateString()}</span></span></button>`;
    }).join("")}</div></section>`;
}

function renderPlan(p) {
  const part = PARTS[step];
  const v = p.values;
  const rail = PARTS.map((pt, i) => `<button data-step="${i}" class="${partState(p, pt)}" ${i === step ? 'aria-current="step"' : ""}>
      <span class="n">${pt.num ?? "!"}</span>${esc(pt.num ? shortTitle(pt) : "Pitfalls")}</button>`).join("");
  $("view").innerHTML = `<section style="display:flex;flex-direction:column;gap:14px">
    <div class="plan-head">
      <div><label class="lbl" for="plan_title">Research idea / project</label>
        <input type="text" id="plan_title" data-field="plan_title" value="${esc(v.plan_title)}" placeholder="e.g. Safe storage counseling after ED visits"></div>
      <div><label class="lbl" for="plan_date">Date</label><input type="date" id="plan_date" data-field="plan_date" value="${esc(v.plan_date)}"></div>
    </div>
    <nav class="rail" aria-label="Worksheet parts">${rail}</nav>
    <article class="panel">
      <div class="eyebrow">${part.num ? `Part ${part.num} of 7` : "Before you finish"}</div>
      <h1>${esc(part.title)}</h1>
      ${part.intro ? `<p class="intro">${esc(part.intro)}</p>` : ""}
      ${partBody(p, part)}
    </article>
    <div class="pager">
      <button ${step === 0 ? "disabled" : ""} data-step="${step - 1}">← ${step ? esc(stepName(step - 1)) : "Back"}</button>
      ${step < PARTS.length - 1 ? `<button class="primary" data-step="${step + 1}">${esc(stepName(step + 1))} →</button>` : `<button class="primary" data-act="pdf">Get filled PDF</button>`}
    </div>
    <div class="panel">
      <h2>Share this plan</h2>
      <p class="hint">Makes the worksheet PDF with everything you've filled in, ready to email to a collaborator or keep.</p>
      <div class="actions">
        <button class="primary" data-act="pdf">Get filled PDF</button>
        <button data-act="email">Email this plan</button>
        <button class="quiet danger" data-act="delete">Delete idea</button>
      </div>
      <div id="confirmBox"></div>
    </div>
  </section>`;
}
const shortTitle = (pt) => ({ p1: "Interests", p2: "Gap", p3: "Question", p4: "Data", p5: "Feasibility", p6: "Refine", p7: "Next steps" })[pt.id] || pt.title;
const stepName = (i) => PARTS[i].num ? `Part ${PARTS[i].num}: ${shortTitle(PARTS[i])}` : "Pitfalls";

function partBody(p, part) {
  const v = p.values;
  return part.groups.map(g => {
    const title = g.title ? `<div class="group-title">${esc(g.title)}</div>` : "";
    switch (g.type) {
      case "checks":
        if (part.id === "p1") return title + `<div class="chips">${g.items.map(i => chip(v, i)).join("")}</div>` +
          g.items.filter(i => i.detail && v[i.id]).map(i => `<div><label class="lbl" for="${i.detail}">${esc(i.label)}</label>
            <input type="text" id="${i.detail}" data-field="${i.detail}" value="${esc(v[i.detail])}"></div>`).join("");
        return title + `<div class="rows">${g.items.map(i => rowCheck(v, i)).join("")}</div>`;
      case "builder": {
        const fields = g.items.map(i => `<label for="${i.id}">${esc(i.label)}</label>
          <input type="text" id="${i.id}" data-field="${i.id}" value="${esc(v[i.id])}">`).join("");
        return `<div class="group-title">Build it from the pieces</div><div class="builder">${fields}</div>
          <div class="preview" id="rqPreview">${previewText(v)}</div>
          <div><button data-act="useBuilt">Use this as my research question</button></div>`;
      }
      case "text":
        return g.items.map(i => {
          let extra = "";
          if (i.id === "rq_final") extra = `<div class="ref"><b>Your draft:</b> ${esc(v.rq_draft || "—")}</div>
            ${v.rq_draft ? `<div><button data-act="copyDraft">Start from my draft</button></div>` : ""}`;
          return `<div><label class="lbl" for="${i.id}">${esc(i.label)}</label>
            <textarea id="${i.id}" data-field="${i.id}" rows="${i.lines || 3}">${esc(v[i.id])}</textarea></div>${extra}`;
        }).join("");
      case "sources":
        return `<div class="rows">${g.items.map(i => sourceRow(v, i)).join("")}</div>`;
      case "radios":
        return g.items.map((i, n) => `<div class="q-radio"><div>${n + 1}. ${esc(i.label)}</div>
          <div class="seg" role="radiogroup">${i.options.map(([val, lab]) =>
            `<button role="radio" data-radio="${i.id}" data-value="${val}" aria-pressed="${v[i.id] === val}" aria-checked="${v[i.id] === val}">${esc(lab)}</button>`).join("")}</div></div>`).join("");
      case "todos":
        return `<div class="todo todo-head"><span>To do</span><span>What/Who do I need</span><span>Rough deadline</span><span></span></div>
          ${p.todos.map((t, n) => `<div class="todo">
            <input type="text" aria-label="To do ${n + 1}" data-todo="${n}" data-key="task" value="${esc(t.task)}" placeholder="To do">
            <input type="text" aria-label="What or who I need ${n + 1}" data-todo="${n}" data-key="who" value="${esc(t.who)}" placeholder="What/who I need">
            <input type="text" aria-label="Rough deadline ${n + 1}" data-todo="${n}" data-key="deadline" value="${esc(t.deadline)}" placeholder="e.g. Dec 1">
            <button class="quiet x" data-rmtodo="${n}" aria-label="Remove row ${n + 1}">✕</button></div>`).join("")}
          <div><button data-act="addTodo">+ Add a step</button></div>
          ${p.todos.length > 6 ? `<p class="hint">The PDF has room for 6 steps; the first 6 are printed.</p>` : ""}`;
    }
    return "";
  }).join("");
}
function chip(v, i) {
  return `<button class="chip" data-check="${i.id}" aria-pressed="${!!v[i.id]}">${esc(i.label)}</button>`;
}
function rowCheck(v, i) {
  const on = !!v[i.id];
  return `<div class="row-check ${on ? "on" : ""}"><button data-check="${i.id}" aria-pressed="${on}"><span class="box">${on ? "✓" : ""}</span>
    <span class="lab">${esc(i.label)}${i.desc ? `<span class="desc">${esc(i.desc)}</span>` : ""}</span></button>
    ${i.detail && on ? `<div class="detail"><input type="text" aria-label="${esc(i.label)}" data-field="${i.detail}" value="${esc(v[i.detail])}" placeholder="Details"></div>` : ""}</div>`;
}
function sourceRow(v, i) {
  const on = !!v[i.id];
  const meta = (i.key || i.limits) ? `<div class="meta">${i.key ? `<span><b>Key data</b>${esc(i.key)}</span>` : "<span></span>"}${i.limits ? `<span><b>Limitations</b>${esc(i.limits)}</span>` : ""}</div>` : "";
  return `<div class="row-check ${on ? "on" : ""}"><button data-check="${i.id}" aria-pressed="${on}"><span class="box">${on ? "✓" : ""}</span>
    <span class="lab">${esc(i.custom ? "Other data source" : i.label)}</span></button>${meta}
    ${i.hint ? `<p class="hint" style="padding-left:28px">${esc(i.hint)}</p>` : ""}
    ${on ? `<div class="detail" style="display:flex;flex-direction:column;gap:6px">
      ${i.custom ? `<input type="text" aria-label="Name of the data source" data-field="${i.id}_name" value="${esc(v[i.id + "_name"])}" placeholder="Name of the data source">` : ""}
      <textarea rows="2" aria-label="${esc(i.label)} notes" data-field="${i.id}_notes" placeholder="Examples / notes">${esc(v[i.id + "_notes"])}</textarea></div>` : ""}</div>`;
}
function previewText(v) {
  const s = (id, ph) => v[id]?.trim() ? esc(v[id].trim()) : `<i>[${ph}]</i>`;
  return `Among ${s("rq_population", "Population")}, how does ${s("rq_exposure", "Exposure or Policy")} compared to ${s("rq_comparison", "Comparison")} affect ${s("rq_outcome", "Outcome")} over ${s("rq_timeframe", "Timeframe or Setting")}?`;
}
function builtQuestion(v) { return previewText(v).replace(/<\/?i>/g, ""); }

/* ---------- interaction ---------- */
function touch(p) { p.updated = Date.now(); saveSoon(); }
$("view").addEventListener("input", (e) => {
  const p = planById(current); if (!p) return;
  const t = e.target;
  if (t.dataset.field) {
    p.values[t.dataset.field] = t.value; touch(p);
    if (t.dataset.field.startsWith("rq_") && $("rqPreview")) $("rqPreview").innerHTML = previewText(p.values);
  } else if (t.dataset.todo) {
    p.todos[+t.dataset.todo][t.dataset.key] = t.value; touch(p);
  }
});
// Re-render on change (not each keystroke) so progress marks update without stealing focus.
$("view").addEventListener("change", (e) => {
  if (e.target.dataset.field === "plan_title" || e.target.dataset.field === "plan_date") return;
  const p = planById(current); if (p) refreshRail(p);
});
function refreshRail(p) {
  document.querySelectorAll(".rail button").forEach((b, i) => {
    b.classList.remove("done", "partial");
    const s = partState(p, PARTS[i]); if (s) b.classList.add(s);
  });
}
$("view").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.act === "new") return go(newPlan().id, 0);
  if (d.open) return go(d.open, 0);
  const p = planById(current); if (!p) return;
  if (d.step !== undefined) { save(); return go(p.id, +d.step); }
  if (d.check) {
    p.values[d.check] = !p.values[d.check]; touch(p);
    const y = window.scrollY; render(); window.scrollTo({ top: y });
    return;
  }
  if (d.radio) {
    p.values[d.radio] = p.values[d.radio] === d.value ? "" : d.value; touch(p);
    const y = window.scrollY; render(); window.scrollTo({ top: y }); return;
  }
  if (d.rmtodo !== undefined) {
    const removed = p.todos.splice(+d.rmtodo, 1)[0];
    if (!p.todos.length) p.todos.push({ task: "", who: "", deadline: "" });
    touch(p); render();
    if (removed.task || removed.who || removed.deadline)
      toast("Step removed", { label: "Undo", run: () => { p.todos.splice(+d.rmtodo, 0, removed); touch(p); render(); } });
    return;
  }
  switch (d.act) {
    case "addTodo": p.todos.push({ task: "", who: "", deadline: "" }); touch(p); render();
      document.querySelector(`[data-todo="${p.todos.length - 1}"]`)?.focus(); break;
    case "useBuilt": {
      const prev = p.values.rq_draft;
      p.values.rq_draft = builtQuestion(p.values); touch(p); render();
      toast("Research question filled in", prev ? { label: "Undo", run: () => { p.values.rq_draft = prev; touch(p); render(); } } : null);
      break;
    }
    case "copyDraft": p.values.rq_final = p.values.rq_draft; touch(p); render(); $("rq_final")?.focus(); break;
    case "pdf": sharePDF(p, false); break;
    case "email": sharePDF(p, true); break;
    case "delete":
      $("confirmBox").innerHTML = `<div class="confirm"><span>Delete “${esc(titleOf(p))}”?</span>
        <button class="primary" data-act="confirmDelete">Delete</button><button data-act="cancelDelete">Keep it</button></div>`; break;
    case "cancelDelete": $("confirmBox").innerHTML = ""; break;
    case "confirmDelete": {
      const i = plans.indexOf(p); plans.splice(i, 1); save(); go(null);
      toast("Idea deleted", { label: "Undo", run: () => { plans.splice(i, 0, p); save(); go(p.id, 0); } });
      break;
    }
  }
});

/* ---------- filled PDF (pdf-lib fills the same fillable worksheet) ---------- */
let pdfLib = null;
function loadPdfLib() {
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  return pdfLib ||= new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";
    s.onload = () => ok(window.PDFLib); s.onerror = () => { pdfLib = null; fail(new Error("load")); };
    document.head.append(s);
  });
}
function pdfValues(p) {
  const v = p.values, out = { text: {}, check: [] };
  out.text.plan_title = v.plan_title || "";
  out.text.plan_date = v.plan_date ? new Date(v.plan_date + "T12:00").toLocaleDateString() : "";
  for (const part of PARTS) for (const g of part.groups) {
    if (g.type === "todos") {
      p.todos.slice(0, g.rows).forEach((t, n) => g.columns.forEach(([k]) => { out.text[`todo${n + 1}_${k}`] = t[k] || ""; }));
      continue;
    }
    for (const i of g.items || []) {
      if (i.appOnly) continue;
      if (g.type === "radios") { if (v[i.id]) out.check.push(`${i.id}_${v[i.id]}`); continue; }
      if (g.type === "builder" || g.type === "text") { out.text[i.id] = v[i.id] || ""; continue; }
      if (v[i.id]) out.check.push(i.id);
      if (i.detail) out.text[i.detail] = v[i.detail] || "";
      if (g.type === "sources") {
        out.text[i.id + "_notes"] = v[i.id + "_notes"] || "";
        if (i.custom) out.text[i.id + "_name"] = v[i.id + "_name"] || "";
      }
    }
  }
  return out;
}
// Helvetica in the PDF can't draw every character; swap the common ones and drop the rest.
const pdfSafe = (s) => s.replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/…/g, "...")
  .replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ–—•]/g, "");
async function buildPDF(p) {
  const { PDFDocument } = await loadPdfLib();
  const bytes = await fetch("RI2ACT-worksheet.pdf").then(r => { if (!r.ok) throw new Error("pdf"); return r.arrayBuffer(); });
  const doc = await PDFDocument.load(bytes);
  const form = doc.getForm();
  const vals = pdfValues(p);
  for (const [name, val] of Object.entries(vals.text)) {
    try { const tf = form.getTextField(name); tf.setMaxLength(undefined); tf.setText(pdfSafe(val)); } catch {}
  }
  for (const name of vals.check) { try { form.getCheckBox(name).check(); } catch {} }
  const out = await doc.save();
  const name = "RI2ACT - " + titleOf(p).replace(/[\\/:*?"<>|]/g, "").slice(0, 60) + ".pdf";
  return new File([out], name, { type: "application/pdf" });
}
function planAsText(p) {
  const v = p.values, lines = [titleOf(p), ""];
  if (v.rq_final || v.rq_draft) lines.push("Research question: " + (v.rq_final || v.rq_draft), "");
  const steps = p.todos.filter(t => t.task.trim());
  if (steps.length) lines.push("Next steps:", ...steps.map(t => `• ${t.task}${t.who ? " (need: " + t.who + ")" : ""}${t.deadline ? " by " + t.deadline : ""}`), "");
  lines.push("The full worksheet is attached as a PDF.");
  return lines.join("\n");
}
function download(file) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function sharePDF(p, email) {
  save();
  let file;
  try { toast("Making the PDF…"); file = await buildPDF(p); }
  catch { return toast("Couldn't make the PDF. Connect to the internet once, then try again."); }
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ title: titleOf(p), text: email ? planAsText(p) : undefined, files: [file] }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  download(file);
  if (email) {
    location.href = "mailto:?subject=" + encodeURIComponent("RI2ACT: " + titleOf(p)) + "&body=" + encodeURIComponent(planAsText(p).slice(0, 1800));
    toast("PDF saved to Downloads. Attach it to the email.");
  } else toast("PDF saved to Downloads");
}

/* ---------- backups (CSV: one row per filled-in answer) ---------- */
const csvCell = (s) => /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
function toCSV() {
  const rows = [["Plan ID", "Plan", "Field", "Value"]];
  for (const p of plans) {
    rows.push([p.id, titleOf(p), "_created", new Date(p.created).toISOString()], [p.id, titleOf(p), "_updated", new Date(p.updated).toISOString()]);
    for (const [k, v] of Object.entries(p.values)) if (v !== "" && v !== false && v != null) rows.push([p.id, titleOf(p), k, v === true ? "yes" : String(v)]);
    p.todos.forEach((t, n) => ["task", "who", "deadline"].forEach(k => { if (t[k]) rows.push([p.id, titleOf(p), `todo${n + 1}_${k}`, t[k]]); }));
  }
  return rows.map(r => r.map(c => csvCell(String(c))).join(",")).join("\r\n");
}
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
const boolFields = new Set(PARTS.flatMap(pt => pt.groups.filter(g => g.type === "checks" || g.type === "sources").flatMap(g => g.items.map(i => i.id))));
function fromCSV(text) {
  const [head, ...rows] = parseCSV(text);
  if (!head || head[0] !== "Plan ID") throw new Error("format");
  const byId = new Map();
  for (const [id, , field, value] of rows) {
    if (!id || !field) continue;
    const p = byId.get(id) || { id, created: Date.now(), updated: Date.now(), values: {}, todos: [] };
    byId.set(id, p);
    const m = field.match(/^todo(\d+)_(task|who|deadline)$/);
    if (field === "_created" || field === "_updated") p[field.slice(1)] = Date.parse(value) || Date.now();
    else if (m) { const n = +m[1] - 1; p.todos[n] ||= { task: "", who: "", deadline: "" }; p.todos[n][m[2]] = value; }
    else p.values[field] = boolFields.has(field) ? value === "yes" : value;
  }
  return [...byId.values()].map(p => { p.todos = p.todos.filter(Boolean); if (!p.todos.length) p.todos.push({ task: "", who: "", deadline: "" }); return p; });
}
const backupFile = () => new File(["﻿" + toCSV()], `ri2act-backup-${localDay()}.csv`, { type: "text/csv" });
$("exportBtn").addEventListener("click", () => { save(); download(backupFile()); });
$("emailBackupBtn").addEventListener("click", async () => {
  save();
  const file = backupFile();
  const text = `RI2ACT backup, ${new Date().toLocaleString()}\n\n` + (plans.map(p => `• ${titleOf(p)}${p.values.rq_final || p.values.rq_draft ? "\n  " + (p.values.rq_final || p.values.rq_draft) : ""}`).join("\n") || "(no ideas yet)") +
    "\n\nTo restore: open RI2ACT, tap Import, and choose the attached file.";
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ title: "RI2ACT backup", text, files: [file] }); } catch {}
    return;
  }
  download(file);
  location.href = "mailto:?subject=" + encodeURIComponent("RI2ACT backup") + "&body=" + encodeURIComponent(text.slice(0, 1800));
  toast("Backup saved to Downloads. Attach it to the email.");
});
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const incoming = fromCSV(await f.text());
    for (const p of incoming) { const i = plans.findIndex(x => x.id === p.id); i >= 0 ? plans.splice(i, 1, p) : plans.push(p); }
    save(); go(null); toast(`Imported ${incoming.length} idea${incoming.length === 1 ? "" : "s"}`);
  } catch { toast("That file isn't an RI2ACT backup."); }
});

load();
fromHash();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
